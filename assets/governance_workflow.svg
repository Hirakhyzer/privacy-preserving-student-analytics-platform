  <rect width="1000" height="300" fill="#f8fafc"/>
  <style>.box{fill:#fff;stroke:#0f766e;stroke-width:2;rx:14}.txt{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}.small{font-size:12px;fill:#475569}.arrow{stroke:#334155;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect class="box" x="40" y="85" width="150" height="80"/><text class="txt" x="70" y="118">Support</text><text class="small" x="66" y="142">need signal</text>
  <rect class="box" x="235" y="85" width="150" height="80"/><text class="txt" x="257" y="118">Uncertainty</text><text class="small" x="265" y="142">review flag</text>
