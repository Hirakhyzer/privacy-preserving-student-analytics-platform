<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-label="Privacy-preserving student analytics workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:800 26px Arial,Helvetica,sans-serif;fill:#0f172a}
      .box{font:700 15px Arial,Helvetica,sans-serif;fill:#0f172a}
      .desc{font:500 12px Arial,Helvetica,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1100" height="380" rx="28" fill="url(#bg)"/>
  <text class="title" x="550" y="48" text-anchor="middle">Leakage-Aware Student Support Workflow</text>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M180 150 L275 150"/><path d="M405 150 L500 150"/><path d="M630 150 L725 150"/><path d="M855 150 L950 150"/>
    <path d="M550 205 L550 255"/><path d="M550 310 L730 310"/><path d="M370 310 L520 310"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="105" width="130" height="90" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text class="box" x="115" y="140" text-anchor="middle">Synthetic</text><text class="box" x="115" y="160" text-anchor="middle">records</text><text class="desc" x="115" y="182" text-anchor="middle">no real students</text>
    <rect x="275" y="105" width="130" height="90" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text class="box" x="340" y="138" text-anchor="middle">Pseudonymize</text><text class="box" x="340" y="160" text-anchor="middle">identifiers</text><text class="desc" x="340" y="182" text-anchor="middle">salted IDs</text>
    <rect x="500" y="105" width="130" height="90" rx="18" fill="#fef3c7" stroke="#d97706"/>
    <text class="box" x="565" y="138" text-anchor="middle">Support</text><text class="box" x="565" y="160" text-anchor="middle">signals</text><text class="desc" x="565" y="182" text-anchor="middle">non-punitive</text>
    <rect x="725" y="105" width="130" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="box" x="790" y="138" text-anchor="middle">Fairness</text><text class="box" x="790" y="160" text-anchor="middle">audit</text><text class="desc" x="790" y="182" text-anchor="middle">gap checks</text>
    <rect x="950" y="105" width="110" height="90" rx="18" fill="#fee2e2" stroke="#dc2626"/>
    <text class="box" x="1005" y="138" text-anchor="middle">Human</text><text class="box" x="1005" y="160" text-anchor="middle">review</text><text class="desc" x="1005" y="182" text-anchor="middle">no automation</text>
    <rect x="370" y="265" width="180" height="90" rx="18" fill="#e0f2fe" stroke="#0284c7"/>
    <text class="box" x="460" y="300" text-anchor="middle">Access governance</text><text class="desc" x="460" y="326" text-anchor="middle">role, purpose, time, export</text>
    <rect x="730" y="265" width="180" height="90" rx="18" fill="#f1f5f9" stroke="#475569"/>
    <text class="box" x="820" y="300" text-anchor="middle">Audit ledger</text><text class="desc" x="820" y="326" text-anchor="middle">hash-chained evidence</text>
  </g>
</svg>